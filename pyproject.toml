[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-vision-poc"
version = "0.1.0"
description = "Computer vision for production lines: zero-shot conveyor counting and fill-volume inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics==8.4.106",
    "supervision==0.29.1",
    "opencv-python==5.0.0.93",
    "lap",
    "PyYAML==6.0.1",
    "numpy",                  # imported directly, not only through cv2
    "tqdm",                   # the download progress bars in assets.py
]

[project.urls]
Source = "https://github.com/sndypvtra/coba_coba"

# torch/torchvision are deliberately not listed: the CPU wheels come from a
# separate index and pinning them here would fight whatever the user installed.
#   pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu

[tool.setuptools.packages.find]
include = ["factory_vision*"]

[tool.setuptools.package-data]
# The tracker gates are data, not code, and `resolve_tracker_cfg` reads them off
# disk - so an install that omits them cannot track anything. This said
# `factory_vision.counting` until it was checked: the directory is
# `factory_vision/trackers/`, and has been since the counting engine was split
# out, so `pip install .` was shipping no tracker config at all.
"factory_vision" = ["trackers/*.yaml"]
